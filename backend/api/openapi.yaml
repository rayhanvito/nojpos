          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /auth/logout:
    post:
      summary: Cabut refresh token dan akhiri sesi.
      tags:
      - Auth
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Cabut refresh token dan akhiri sesi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
  /auth/otp/send:
    post:
      summary: Kirim kode OTP untuk verifikasi email.
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailRequest'
      responses:
        '200':
          description: Kirim kode OTP untuk verifikasi email.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
