      - name: categoryId
        in: query
        required: false
        schema:
          type: integer
      - name: page
        in: query
        required: false
        schema:
          type: integer
      - name: limit
        in: query
        required: false
        schema:
          type: integer
      - name: active
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
