components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-Api-Key
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    VariantId:
      name: variantId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    TierId:
      name: tierId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PromoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  responses:
    BadRequest:
      description: Permintaan tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Autentikasi gagal atau sesi tidak valid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Forbidden:
      description: Akses ditolak untuk peran atau jenis autentikasi ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NotFound:
      description: Data tidak ditemukan.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflict:
      description: Permintaan bertentangan dengan status data saat ini.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Gone:
      description: Kode OTP telah kedaluwarsa.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: Batas permintaan tercapai.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    InternalError:
      description: Terjadi kesalahan pada server.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
          description: Pesan kesalahan yang dapat dibaca manusia.
        code:
          type: string
          description: Kode mesin bila dikirim handler, misalnya SHIFT_REQUIRED, PASSCODE_REQUIRED, PASSCODE_WRONG, OTP_REQUIRED, OTP_WRONG, OTP_EXPIRED, OTP_MAX_ATTEMPTS, PROMO_INVALID, PROMO_CODE_TAKEN, BAD_DIRECTION, TRANSFER_SAME_OUTLET, TRANSFER_ITEMS_EMPTY, TRANSFER_INVALID_QTY, TRANSFER_INVALID_ITEM, API_KEY_NAME_REQUIRED, NOT_FOUND, WEBHOOK_NOT_FOUND, WEBHOOK_URL_INVALID, WEBHOOK_URL_PRIVATE, WEBHOOK_EVENTS_INVALID, atau INTERNAL.
      required:
      - error
    Page:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            additionalProperties: true
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
      required:
      - items
      - total
      - page
      - limit
    Message:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    Status:
      type: object
      properties:
        status:
          type: string
      required:
      - status
    Total:
      type: object
      properties:
        total:
          type: integer
          format: int64
      required:
      - total
    OkResult:
      type: object
      properties:
        ok:
          type: boolean
      required:
      - ok
    Verified:
      type: object
      properties:
        verified:
          type: boolean
        message:
          type: string
      required:
      - verified
      - message
    Health:
      type: object
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        database:
          type: string
          enum:
          - up
          - down
        service:
          type: string
      required:
      - status
      - database
      - service
    Category:
      type: object
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        store_id:
          type: integer
          format: int64
        name:
          type: string
        active:
          type: boolean
      required:
      - id
      - created_at
      - updated_at
      - store_id
      - name
      - active
    PriceTier:
      type: object
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        product_id:
          type: integer
          format: int64
        variant_id:
          type: integer
          format: int64
          nullable: true
        min_qty:
          type: integer
        sell_price:
          type: integer
          format: int64
          nullable: true
      required:
      - id
      - created_at
      - updated_at
      - product_id
      - min_qty
      - sell_price
    Variant:
      type: object
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        outlet_id:
          type: integer
          format: int64
          nullable: true
        product_id:
          type: integer
          format: int64
        name:
