openapi: 3.0.3
info:
  title: NOJPOS API
  version: 1.0.0
  description: >-
    Spesifikasi OpenAPI NOJPOS. Dokumen ini adalah pilot untuk domain
    promo: cakupan jalurnya baru domain promo (CRUD admin /promos dan
    pratinjau /promos/preview); domain lain menyusul.
servers:
  - url: /api/v1
security:
  - bearerAuth: []
paths:
  /promos:
    get:
      summary: Daftar promo toko
      responses:
        '200':
          description: Daftar promo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoList'
    post:
      summary: Buat promo baru
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoInput'
      responses:
        '201':
          description: Promo terbuat
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promo'
        '400':
          description: Masukan promo tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /promos/{id}:
    parameters:
      - $ref: '#/components/parameters/PromoId'
    get:
      summary: Ambil satu promo
      responses:
        '200':
          description: Promo ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promo'
        '404':
          description: Promo tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    put:
      summary: Ubah promo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PromoInput'
      responses:
        '200':
          description: Promo terubah
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Promo'
        '400':
          description: Masukan promo tidak valid
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Promo tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
    delete:
      summary: Hapus promo
      responses:
        '200':
          description: Promo terhapus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '404':
          description: Promo tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /promos/{id}/active:
    parameters:
      - $ref: '#/components/parameters/PromoId'
    patch:
      summary: Aktif/nonaktifkan promo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - active
              properties:
                active:
                  type: boolean
      responses:
        '200':
          description: Status promo diperbarui
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Status aktif wajib diisi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Promo tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /promos/preview:
    post:
      summary: Pratinjau diskon promo untuk keranjang
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PreviewRequest'
      responses:
        '200':
          description: Hasil pratinjau promo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PromoPreview'
        '400':
          description: Pratinjau tidak valid (mis. voucher tidak berlaku)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '404':
          description: Produk tidak ditemukan
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    PromoId:
      name: id
      in: path
      required: true
      schema:
        type: integer
  schemas:
    Promo:
      type: object
      required:
        - id
        - created_at
        - updated_at
        - store_id
        - name
        - type
        - value
        - scope
        - voucher_code
        - starts_at
        - ends_at
        - min_purchase
        - max_discount
        - combinable
        - active
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        store_id:
          type: integer
        name:
          type: string
        type:
          type: string
          enum:
            - percent
            - amount
        value:
          oneOf:
            - type: number
            - type: integer
        scope:
          type: string
          enum:
            - all
            - category
            - product
        category_id:
          type: integer
          nullable: true
        product_id:
          type: integer
          nullable: true
        voucher_code:
          type: string
          nullable: true
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        happy_start:
          type: string
          nullable: true
        happy_end:
          type: string
          nullable: true
        min_purchase:
          type: integer
          format: int64
        max_discount:
          type: integer
          format: int64
        combinable:
          type: boolean
        active:
          type: boolean
    PromoList:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Promo'
    PromoInput:
      type: object
      required:
        - name
        - type
        - value
        - scope
        - startsAt
        - endsAt
      properties:
        name:
          type: string
        type:
          type: string
          enum:
            - percent
            - amount
        value:
          type: number
        scope:
          type: string
          enum:
            - all
            - category
            - product
        categoryId:
          type: integer
          nullable: true
        productId:
          type: integer
          nullable: true
        voucherCode:
          type: string
          nullable: true
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
        happyStart:
          type: string
          nullable: true
        happyEnd:
          type: string
          nullable: true
        minPurchase:
          type: integer
          format: int64
        maxDiscount:
          type: integer
          format: int64
        combinable:
          type: boolean
    PreviewRequest:
      type: object
      required:
        - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PreviewItem'
        voucherCode:
          type: string
    PreviewItem:
      type: object
      required:
        - productId
        - qty
      properties:
        productId:
          type: integer
        variantId:
          type: integer
          nullable: true
        qty:
          type: integer
    PromoPreview:
      type: object
      required:
        - promo_id
        - promo_name
        - promo_discount
        - voucher_id
        - voucher_name
        - voucher_code
        - voucher_discount
      properties:
        promo_id:
          type: integer
        promo_name:
          type: string
        promo_discount:
          type: integer
          format: int64
        voucher_id:
          type: integer
        voucher_name:
          type: string
        voucher_code:
          type: string
        voucher_discount:
          type: integer
          format: int64
    Message:
      type: object
      required:
        - message
      properties:
        message:
          type: string
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: string
        code:
          type: string
