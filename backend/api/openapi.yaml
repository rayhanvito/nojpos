            schema:
              $ref: '#/components/schemas/ResetPasswordRequest'
      responses:
        '200':
          description: Atur kata sandi baru dengan kode OTP.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /presence/heartbeat:
    post:
      summary: Catat kehadiran pengguna yang sedang aktif.
      tags:
      - Auth
      security:
      - bearerAuth: []
      description: Wajib memakai Bearer JWT; autentikasi X-Api-Key ditolak.
      responses:
        '200':
          description: Catat kehadiran pengguna yang sedang aktif.
          content:
            application/json:
