openapi: 3.0.3
info:
  title: NOJPOS API
  version: 1.0.0
  description: 'API NOJPOS memakai base path /api/v1. Endpoint publik tidak memerlukan autentikasi. Endpoint data dan admin umumnya menerima Bearer JWT atau API key melalui header X-Api-Key; API key mewakili admin toko dan dibatasi ke scope toko. API key tidak dapat dipakai pada /api-keys/*, /users/*, /webhooks/*, endpoint /auth/* yang terautentikasi, POST /presence/heartbeat, penulisan /outlets (POST/PUT), dan PUT /settings; operasi tersebut wajib memakai Bearer JWT. Endpoint admin memerlukan role admin; kasir menerima 403. Respons daftar berpaginasi menggunakan amplop {items,total,page,limit}; beberapa daftar tanpa paginasi hanya memakai {items}. Error berbentuk {error,code}, dengan code opsional jika handler tidak menyediakan kode mesin. Webhook dikirim dengan header X-NOJPOS-Signature: sha256=HMAC_SHA256(secret, raw_body) dan X-NOJPOS-Event. Event sah: transaction.created, transaction.refunded, stock.updated. Rate limit: POST /auth/login 5 per IP/menit; POST /auth/forgot-password/send 3 per IP/menit; POST /auth/switch 10 per pengguna+IP/menit; POST /auth/otp/send 5 per IP/10 menit; POST /auth/register dan POST /auth/google berbagi 10 per IP/10 menit.'
servers:
- url: /api/v1
tags:
- name: Auth
- name: Catalog
- name: Inventory
- name: Promo
- name: Customers
- name: Sales
- name: Shifts
- name: Purchasing
- name: Finance
- name: Reports
- name: Outlets
- name: Users
- name: Notifications
- name: Activity
- name: System
- name: ApiKeys
- name: Webhooks
paths:
  /health:
    get:
      summary: Periksa status layanan dan koneksi basis data.
      tags:
      - System
      security: []
      responses:
        '200':
          description: Periksa status layanan dan koneksi basis data.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /auth/register:
    post:
      summary: Daftarkan pemilik dan toko baru.
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Daftarkan pemilik dan toko baru.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '410':
          $ref: '#/components/responses/Gone'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/login:
    post:
      summary: Masuk dengan email dan kata sandi.
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Masuk dengan email dan kata sandi.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /auth/google:
    post:
      summary: Masuk atau daftar menggunakan token Google.
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GoogleLoginRequest'
      responses:
        '200':
          description: Masuk atau daftar menggunakan token Google.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalError'
  /auth/refresh:
    post:
      summary: Perbarui token menggunakan refresh token.
      tags:
      - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
