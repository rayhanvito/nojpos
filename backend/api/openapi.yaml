        min_stock:
          type: integer
        price_tiers:
          type: array
          items:
            $ref: '#/components/schemas/PriceTier'
          nullable: true
      required:
      - id
      - created_at
      - updated_at
      - product_id
      - name
      - sku
      - buy_price
      - sell_price
      - stock
      - min_stock
      - price_tiers
    Product:
      type: object
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
          format: date-time
          nullable: true
        outlet_id:
          type: integer
          format: int64
          nullable: true
        category_id:
          type: integer
          format: int64
          nullable: true
        category_name:
          type: string
          nullable: true
        name:
          type: string
        sku:
          type: string
        barcode:
          type: string
        buy_price:
          type: integer
          format: int64
          nullable: true
        sell_price:
          type: integer
          format: int64
          nullable: true
        stock:
          type: integer
        min_stock:
          type: integer
        unit:
