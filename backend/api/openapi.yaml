      required:
      - id
      - created_at
      - updated_at
      - category_id
      - category_name
      - name
      - sku
      - barcode
      - buy_price
      - sell_price
      - stock
      - min_stock
      - unit
      - active
      - variants
      - price_tiers
    Customer:
      type: object
      properties:
        id:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
          nullable: true
        updated_at:
          type: string
