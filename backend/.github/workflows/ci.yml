name: CI

# Workflow CI backend NOJPOS — file ini baru di-commit lokal dan BELUM
# diaktifkan (belum di-push ke GitHub). Aktif begitu repo di-push.

on:
  push:
  pull_request:

jobs:
  build-vet-test:
    name: Build, vet & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go (versi dari go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
